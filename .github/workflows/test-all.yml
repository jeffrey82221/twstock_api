name: Test all

on:
  pull_request:

permissions:
  contents: read

jobs:
  test-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: python -m pip install -r requirements-py311.txt
      - name: Run offline pytest suite
        run: pytest tests/ -m "not upstream_contract and not poc_view_select" -q

  test-sql-view-creation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: python -m pip install -r requirements-py311.txt
      - name: Resolve host.docker.internal
        run: echo "127.0.0.1 host.docker.internal" | sudo tee -a /etc/hosts
      - name: Test SQL view creation
        run: pytest tests/test_sql_view_creation.py

  test-sql-table-lineage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: python -m pip install -r requirements-py311.txt
      - name: Resolve host.docker.internal
        run: echo "127.0.0.1 host.docker.internal" | sudo tee -a /etc/hosts
      - name: Test SQL table lineage consistency
        run: pytest tests/test_sql_table_lineage_consistency.py

  test-sql-column-lineage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: python -m pip install -r requirements-py311.txt
      - name: Resolve host.docker.internal
        run: echo "127.0.0.1 host.docker.internal" | sudo tee -a /etc/hosts
      - name: Test SQL column lineage coverage
        run: pytest tests/test_sql_column_lineage_coverage.py

  test-poc-view-select:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: python -m pip install -r requirements-py311.txt
      - name: Resolve host.docker.internal
        run: echo "127.0.0.1 host.docker.internal" | sudo tee -a /etc/hosts
      - name: Test selecting one row from each POC view
        run: RUN_POC_VIEW_SELECT_TESTS=1 pytest tests/test_sql_select_one_row.py -vv
