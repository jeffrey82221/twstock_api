name: Test all

on:
  pull_request:

permissions:
  contents: read

jobs:
  test-db-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: python -m pip install -r requirements-py311.txt
      - name: Test db-demo
        run: pytest tests/db_demo/ -q

  test-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: python -m pip install -r requirements-py311.txt
      - name: Test source adapters and services
        run: pytest tests/source/ -q

  test-endpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: python -m pip install -r requirements-py311.txt
      - name: Test API endpoints
        run: pytest tests/endpoint/ -q

  test-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: python -m pip install -r requirements-py311.txt
      - name: Test pipeline
        run: pytest tests/pipeline/ -q

  test-pg-tool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: python -m pip install -r requirements-py311.txt
      - name: Test PostgreSQL tool
        run: pytest tests/pg_tool/ -q

  test-sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: python -m pip install -r requirements-py311.txt
      - name: Resolve host.docker.internal
        run: echo "127.0.0.1 host.docker.internal" | sudo tee -a /etc/hosts
      - name: Test SQL suite
        run: pytest tests/sql/ -q

  test-live-sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: python -m pip install -r requirements-py311.txt
      - name: Resolve host.docker.internal
        run: echo "127.0.0.1 host.docker.internal" | sudo tee -a /etc/hosts
      - name: Test live POC views
        run: RUN_POC_VIEW_SELECT_TESTS=1 pytest tests/live_sql/ -vv

  test-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: python -m pip install -r requirements-py311.txt
      - name: Test live upstream contracts
        env:
          RUN_UPSTREAM_CONTRACT_TESTS: "1"
        run: pytest tests/upstream/ -m upstream_contract -q
