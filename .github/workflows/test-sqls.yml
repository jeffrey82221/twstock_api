name: Test SQLs

on:
  pull_request:

permissions:
  contents: read

jobs:
  test-sqls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: python -m pip install -r requirements-py311.txt
      - name: Resolve host.docker.internal (used by raw_*.sql views)
        run: echo "127.0.0.1 host.docker.internal" | sudo tee -a /etc/hosts
      - name: Run offline pytest suite
        run: pytest tests/ -m "not upstream_contract and not poc_view_select" -q
      - name: Run test-sqls.sh
        run: bash ./test-sqls.sh
